services:
  - type: web
    name: traxia-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 4000
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: JWT_SIGNING_SECRET_BASE64
        value: lwVbz94PepMyYWcrtNf+d271n7d0DyEvgk3l5ChhZrs=
      - key: AUTH_RATE_LIMIT_HMAC_SECRET_BASE64
        value: 88UVzvbkLoPMydd1K+5kmBSgPb0llX4ELwhNvfniEuE=
      - key: GOOGLE_CLIENT_ID
        value: 889356702185-0pqo4fj9gmp5tqqcltdli9ketkvep2me.apps.googleusercontent.com
      - key: WEB_ALLOWED_ORIGINS
        sync: false
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: TRAXIA_REGISTRATION_ENABLED
        value: "true"
