services:
  - type: web
    name: traxia-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080
      - key: MYSQL_HOST
        value: gateway01.us-east-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        value: test
      - key: MYSQL_USER
        value: 3oPhPmpWZYLdVCW.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: JWT_SIGNING_SECRET_BASE64
        value: lwVbz94PepMyYWcrtNf+d271n7d0DyEvgk3l5ChhZrs=
      - key: AUTH_RATE_LIMIT_HMAC_SECRET_BASE64
        value: 88UVzvbkLoPMydd1K+5kmBSgPb0llX4ELwhNvfniEuE=
      - key: GOOGLE_CLIENT_ID
        value: 889356702185-0pqo4fj9gmp5tqqcltdli9ketkvep2me.apps.googleusercontent.com
      - key: WEB_ALLOWED_ORIGINS
        value: "http://localhost:5000,https://*.vercel.app"
      - key: REFRESH_COOKIE_SECURE
        value: "false"
      - key: TRAXIA_REGISTRATION_ENABLED
        value: "true"
